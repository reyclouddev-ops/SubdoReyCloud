<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DNS Manual - ReyCloud</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="card">

<h2>☁️ DNS Manual</h2>

<p class="subtitle">

Buat Record A / AAAA dengan mudah.

</p>

<hr>

<label>

Jenis DNS

</label>

<select id="type">

<option value="panel">
🖥️ Panel Pterodactyl
</option>

<option value="website">
🌍 Website
</option>

<option value="custom">
📦 Custom A
</option>

<option value="aaaa">
🌐 AAAA (IPv6)
</option>

</select>

<div id="dynamicForm"></div>

<label>

Cloudflare Proxy

</label>

<select id="proxy">

<option value="true">

🟠 Proxy ON

</option>

<option value="false">

⚪ DNS Only

</option>

</select>

<button id="createBtn">

🚀 Create DNS

</button>

<button
onclick="location.href='dashboard.html'">

🏠 Dashboard

</button>

<div id="result"></div>

</div>

<script>

const DOMAIN = "legionteknologi.my.id"

const type =
document.getElementById("type")

const form =
document.getElementById("dynamicForm")

renderForm()

type.onchange = renderForm

function renderForm(){

switch(type.value){

case "panel":

form.innerHTML = `

<label>

Hostname

</label>

<input
id="hostname"
placeholder="rey">

<div class="dns-preview">

Panel :
<b id="panelPreview">

panel.rey.${DOMAIN}

</b>

</div>

<div class="dns-preview">

Node :
<b id="nodePreview">

node.rey.${DOMAIN}

</b>

</div>

<label>

IP VPS

</label>

<input
id="target"
placeholder="103.xxx.xxx.xxx">

`

break

case "website":

form.innerHTML = `

<label>

Hostname

</label>

<input
id="hostname"
placeholder="blog">

<div class="dns-preview">

<b id="panelPreview">

blog.${DOMAIN}

</b>

</div>

<label>

IP Hosting

</label>

<input
id="target"
placeholder="103.xxx.xxx.xxx">

`

break

case "custom":

form.innerHTML = `

<label>

Hostname

</label>

<input
id="hostname"
placeholder="custom">

<div class="dns-preview">

<b id="panelPreview">

custom.${DOMAIN}

</b>

</div>

<label>

IPv4

</label>

<input
id="target"
placeholder="103.xxx.xxx.xxx">

`

break

case "aaaa":

form.innerHTML = `

<label>

Hostname

</label>

<input
id="hostname"
placeholder="ipv6">

<div class="dns-preview">

<b id="panelPreview">

ipv6.${DOMAIN}

</b>

</div>

<label>

IPv6

</label>

<input
id="target"
placeholder="2404:6800:4003:c02::64">

`

break

}

setTimeout(bindPreview,50)

}

function bindPreview(){

const host =
document.getElementById("hostname")

if(!host) return

host.oninput = ()=>{

const value =
host.value.trim().toLowerCase() || "hostname"

const panel =
document.getElementById("panelPreview")

const node =
document.getElementById("nodePreview")

if(panel){

if(type.value==="panel"){

panel.innerHTML =
`panel.${value}.${DOMAIN}`

}else{

panel.innerHTML =
`${value}.${DOMAIN}`

}

}

if(node){

node.innerHTML =
`node.${value}.${DOMAIN}`

}

}

}

</script>

<script src="js/create.js"></script>

</body>

</html>
